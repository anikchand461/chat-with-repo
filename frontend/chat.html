<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chat | ChatWithRepo</title>
    <meta name="description" content="Ask questions about your indexed GitHub repository." />
    <link rel="icon" type="image/png" href="assets/logo-chatwithrepo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      document.documentElement.setAttribute(
        "data-theme",
        localStorage.getItem("devlens_theme") ||
          (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
      );
    </script>
    <style>
      :root {
        --brand-700: #0b6e4f;
        --brand-600: #0e9f6e;
        --brand-500: #17b57f;
        --brand-400: #3dcf97;
        --brand-300: #9fead0;
        --paper: #f3f7f5;
        --paper-raised: #ffffff;
        --paper-sunken: #e8f0ec;
        --ink: #0c211b;
        --ink-soft: #5a6f66;
        --line: rgba(12, 33, 27, 0.1);
        --user-bg: linear-gradient(135deg, #2dd4a0, #0e9f6e);
        --user-ink: #04261a;
        --shadow: 0 8px 28px -12px rgba(6, 40, 30, 0.35);
        --radius: 14px;
        --sidebar-w: 280px;
        --header-h: 60px;
        color-scheme: light;
      }

      html[data-theme="dark"] {
        --paper: #0a1411;
        --paper-raised: #12201b;
        --paper-sunken: #0e1a16;
        --ink: #e8f5ef;
        --ink-soft: #8fb5a6;
        --line: rgba(159, 234, 208, 0.12);
        --user-bg: linear-gradient(135deg, #34d399, #059669);
        --user-ink: #022c1c;
        --shadow: 0 12px 32px -14px rgba(0, 0, 0, 0.55);
        color-scheme: dark;
      }

      *, *::before, *::after { box-sizing: border-box; }

      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        font-family: "Inter", system-ui, sans-serif;
        color: var(--ink);
        position: relative;
        background:
          radial-gradient(ellipse 80% 50% at 20% 0%, color-mix(in srgb, var(--brand-500) 12%, transparent), transparent 55%),
          radial-gradient(ellipse 60% 40% at 90% 20%, color-mix(in srgb, var(--brand-500) 8%, transparent), transparent 50%),
          var(--paper);
        transition: background-color 0.4s ease;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image:
          linear-gradient(var(--line) 1px, transparent 1px),
          linear-gradient(90deg, var(--line) 1px, transparent 1px);
        background-size: 48px 48px;
        mask-image: radial-gradient(ellipse 70% 60% at 50% 30%, black 20%, transparent 75%);
        -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 30%, black 20%, transparent 75%);
        pointer-events: none;
        opacity: 0.7;
        z-index: 0;
      }

      a { color: inherit; text-decoration: none; }

      a:focus-visible,
      button:focus-visible,
      textarea:focus-visible {
        outline: 2px solid var(--brand-500);
        outline-offset: 2px;
      }

      /* Brand */
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-family: "Plus Jakarta Sans", sans-serif;
        font-weight: 800;
        font-size: 17px;
        letter-spacing: -0.02em;
        color: var(--ink);
      }
      .brand span { color: var(--brand-500); }
      .brand-logo {
        width: 44px;
        height: 32px;
        flex: none;
        border-radius: 7px;
        object-fit: contain;
      }
      .brand-dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--brand-500);
        box-shadow: 0 0 0 0 rgba(23, 181, 127, 0.5);
        animation: pulse 2.4s ease-in-out infinite;
      }
      @keyframes pulse {
        0%   { box-shadow: 0 0 0 0 rgba(23, 181, 127, 0.5); }
        70%  { box-shadow: 0 0 0 8px transparent; }
        100% { box-shadow: 0 0 0 0 transparent; }
      }

      /* Buttons */
      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font: inherit;
        font-weight: 600;
        font-size: 14px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        padding: 11px 16px;
        color: var(--user-ink);
        background: var(--user-bg);
        box-shadow: var(--shadow);
        transition: transform 0.15s ease, filter 0.15s ease;
      }
      .button:hover { transform: translateY(-1px); filter: brightness(1.05); }
      .button:active { transform: none; }
      .button.secondary {
        background: transparent;
        color: var(--ink);
        border: 1.5px solid var(--line);
        box-shadow: none;
      }
      .button.secondary:hover {
        border-color: var(--brand-500);
        color: var(--brand-500);
      }
      .button:disabled {
        cursor: not-allowed;
        opacity: 0.65;
        transform: none;
      }

      .icon-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 38px;
        height: 38px;
        flex: none;
        border-radius: 50%;
        border: 1px solid var(--line);
        background: var(--paper-raised);
        color: var(--ink-soft);
        cursor: pointer;
        transition: color 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
      }
      .icon-btn:hover {
        color: var(--brand-500);
        border-color: var(--brand-400);
        transform: translateY(-1px);
      }
      .icon-btn svg { width: 18px; height: 18px; }

      .theme-toggle .sun { display: none; }
      html[data-theme="dark"] .theme-toggle .moon { display: none; }
      html[data-theme="dark"] .theme-toggle .sun { display: block; }
      .theme-toggle svg { transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1); }
      .theme-toggle.spin svg { transform: rotate(180deg); }

      /* ========== Full-bleed layout ========== */
      .chat-layout {
        display: grid;
        grid-template-columns: var(--sidebar-w) 1fr;
        gap: 16px;
        width: 100%;
        height: 100%;
        height: 100dvh;
        max-height: 100dvh;
        padding: 16px;
        overflow: hidden;
        position: relative;
        z-index: 1;
      }

      /* Sidebar */
      .sidebar {
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 20px 16px;
        background: color-mix(in srgb, var(--paper-raised) 88%, transparent);
        backdrop-filter: blur(16px) saturate(140%);
        -webkit-backdrop-filter: blur(16px) saturate(140%);
        border: 1px solid var(--line);
        border-radius: 20px;
        box-shadow: 0 8px 32px -12px rgba(0, 0, 0, 0.4);
        overflow: hidden;
        min-height: 0;
      }
      .sidebar h2 {
        font-family: "Plus Jakarta Sans", sans-serif;
        font-size: 15px;
        font-weight: 700;
        margin: 6px 0 0;
        letter-spacing: -0.01em;
        line-height: 1.35;
        word-break: break-word;
      }
      .sidebar #branch {
        margin: 0;
        font-size: 12px;
        color: var(--ink-soft);
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .sidebar #branch:not(:empty)::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--brand-500);
        flex-shrink: 0;
      }
      .sidebar h3 {
        margin: 10px 0 0;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: var(--ink-soft);
      }
      .sidebar > .button {
        width: 100%;
        margin-top: 4px;
        position: relative;
        overflow: hidden;
        font-weight: 700;
        color: #052e16;
        background: linear-gradient(135deg, #4ade80 0%, #22c55e 45%, #16a34a 100%);
        box-shadow:
          0 4px 0 0 #15803d,
          0 10px 28px -6px rgba(34, 197, 94, 0.5),
          0 0 0 1px rgba(255, 255, 255, 0.12) inset;
        transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.18s ease, filter 0.18s ease;
      }
      .sidebar > .button:hover {
        transform: translateY(-2px);
        filter: brightness(1.05);
        box-shadow:
          0 6px 0 0 #15803d,
          0 14px 32px -6px rgba(34, 197, 94, 0.6),
          0 0 0 1px rgba(255, 255, 255, 0.18) inset;
      }
      .sidebar > .button:active {
        transform: translateY(1px);
        box-shadow:
          0 2px 0 0 #15803d,
          0 6px 18px -6px rgba(34, 197, 94, 0.4);
      }

      .chat-list {
        display: flex;
        flex-direction: column;
        gap: 4px;
        overflow-y: auto;
        flex: 1 1 0;
        min-height: 0;
        padding-right: 2px;
      }
      .chat-list:empty::after {
        content: "No previous chats yet.";
        font-size: 13px;
        color: var(--ink-soft);
        padding: 8px 2px;
      }
      #chat-list > * {
        display: block;
        padding: 10px 12px;
        border-radius: 10px;
        font-size: 13px;
        color: var(--ink-soft);
        border: 1px solid transparent;
        transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
      }
      #chat-list > *:hover {
        background: var(--paper-sunken);
        color: var(--ink);
      }
      #chat-list > *.active {
        background: color-mix(in srgb, var(--brand-500) 14%, transparent);
        border-color: color-mix(in srgb, var(--brand-500) 45%, transparent);
        color: var(--brand-500);
        font-weight: 600;
      }

      .sidebar-foot {
        margin-top: auto;
        display: grid;
        gap: 8px;
        padding-top: 12px;
        border-top: 1px solid var(--line);
      }
      .sidebar-foot a {
        font-size: 13px;
        color: var(--ink-soft);
      }
      .sidebar-foot a:hover { color: var(--brand-500); }

      .sidebar-backdrop {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 25;
        background: rgba(4, 16, 12, 0.5);
        backdrop-filter: blur(3px);
      }

      /* Main chat column */
      .chat {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
        height: 100%;
        overflow: hidden;
        background: color-mix(in srgb, var(--paper-raised) 82%, transparent);
        backdrop-filter: blur(16px) saturate(140%);
        -webkit-backdrop-filter: blur(16px) saturate(140%);
        border: 1px solid var(--line);
        border-radius: 20px;
        box-shadow: 0 8px 32px -12px rgba(0, 0, 0, 0.4);
      }

      .chat-header {
        flex-shrink: 0;
        height: var(--header-h);
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 20px;
        border-bottom: 1px solid var(--line);
        border-radius: 20px 20px 0 0;
        background: transparent;
      }
      .chat-header h2 {
        flex: 1;
        margin: 0;
        font-size: 15px;
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .nav-actions { display: flex; align-items: center; gap: 6px; }
      .chat-drawer-btn { display: none; }
      .chat-drawer-btn .hamburger-lines {
        display: flex;
        flex-direction: column;
        gap: 4px;
        width: 16px;
      }
      .chat-drawer-btn .hamburger-lines i {
        display: block;
        height: 2px;
        background: currentColor;
        border-radius: 2px;
      }

      /* Messages */
      .messages {
        flex: 1 1 0;
        min-height: 0;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 20px 24px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        scroll-behavior: smooth;
      }
      .messages:empty::after {
        content: "Ask anything about this repository to get started.";
        margin: auto;
        color: var(--ink-soft);
        font-size: 14px;
      }

      .messages > * {
        max-width: min(720px, 85%);
        padding: 12px 16px;
        border-radius: var(--radius);
        background: var(--paper-raised);
        border: 1px solid var(--line);
        font-size: 14.5px;
        line-height: 1.55;
        box-shadow: var(--shadow);
        align-self: flex-start;
        border-bottom-left-radius: 4px;
        white-space: pre-wrap;
        word-break: break-word;
        animation: msg-in 0.25s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .messages > .user,
      .messages > .message.user {
        align-self: flex-end;
        background: var(--user-bg);
        color: var(--user-ink);
        border-color: transparent;
        border-bottom-left-radius: var(--radius);
        border-bottom-right-radius: 4px;
        font-weight: 500;
      }
      .messages > .assistant,
      .messages > .message.assistant {
        align-self: flex-start;
      }

      @keyframes msg-in {
        from { opacity: 0; transform: translateY(6px); }
        to   { opacity: 1; transform: none; }
      }
      @media (prefers-reduced-motion: reduce) {
        .messages > *, .brand-dot { animation: none; }
      }

      /* Typing (app.js .typing with <i>) */
      .typing {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        align-self: flex-start;
        padding: 14px 16px;
        border-radius: var(--radius);
        background: var(--paper-raised);
        border: 1px solid var(--line);
      }
      .typing i {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--ink-soft);
        animation: bounce 1.1s ease-in-out infinite;
      }
      .typing i:nth-child(2) { animation-delay: 0.15s; }
      .typing i:nth-child(3) { animation-delay: 0.3s; }
      @keyframes bounce {
        0%, 60%, 100% { transform: none; opacity: 0.45; }
        30% { transform: translateY(-4px); opacity: 1; }
      }

      .empty {
        margin: auto;
        text-align: center;
        color: var(--ink-soft);
        max-width: 360px;
      }
      .empty h2 {
        margin: 0 0 8px;
        font-size: 18px;
        color: var(--ink);
        font-family: "Plus Jakarta Sans", sans-serif;
      }
      .empty p { margin: 0; font-size: 14px; line-height: 1.5; }

      /* Composer — full width of chat column */
      .composer {
        flex-shrink: 0;
        display: flex;
        align-items: flex-end;
        gap: 10px;
        width: 100%;
        padding: 14px 20px 18px;
        border-top: 1px solid var(--line);
        border-radius: 0 0 20px 20px;
        background: transparent;
      }
      .composer textarea {
        flex: 1;
        width: 100%;
        resize: none;
        max-height: 140px;
        min-height: 44px;
        font: inherit;
        font-size: 14.5px;
        line-height: 1.45;
        padding: 12px 16px;
        border-radius: 22px;
        border: 1.5px solid var(--line);
        background: var(--paper-raised);
        color: var(--ink);
        outline: none;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }
      .composer textarea:focus {
        border-color: var(--brand-500);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand-500) 22%, transparent);
      }
      .composer textarea::placeholder { color: var(--ink-soft); }
      .composer .button {
        border-radius: 50%;
        width: 44px;
        height: 44px;
        padding: 0;
        flex: none;
      }
      .composer .button svg { width: 18px; height: 18px; }

      /* Mobile */
      @media (max-width: 860px) {
        .chat-layout { grid-template-columns: 1fr; padding: 10px; }
        .chat-drawer-btn { display: inline-flex; }
        .sidebar {
          position: fixed;
          top: 0;
          left: 0;
          bottom: 0;
          z-index: 30;
          width: min(var(--sidebar-w), 86vw);
          border-radius: 0 20px 20px 0;
          border-left: none;
          transform: translateX(-105%);
          box-shadow: var(--shadow);
          transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
        }
        body.drawer-open .sidebar,
        .sidebar.open { transform: translateX(0); }
        body.drawer-open .sidebar-backdrop,
        .sidebar-backdrop.open { display: block; }
        .messages { padding: 16px; }
        .messages > * { max-width: 92%; }
        .composer { padding: 12px 14px 16px; }
      }
    </style>

    <!-- Syntax highlighting for fenced code blocks in chat replies -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css"
    />

    <!-- Renders **bold**, `inline code`, ```fenced code```, lists, and
         headings inside assistant replies. Must load after the theme
         <style> block above so it can pick up --ink / --brand-500 / --line. -->
    <link rel="stylesheet" href="css/markdown.css" />
  </head>
  <body>
    <div class="sidebar-backdrop"></div>

    <main class="chat-layout">
      <aside class="sidebar">
        <a class="brand" href="dashboard.html">
          <img class="brand-logo" src="assets/logo-chatwithrepo.png" alt="ChatWithRepo logo" />
          Chat<span>WithRepo</span>
        </a>

        <h2 id="chat-title">Repository chat</h2>
        <p id="branch"></p>

        <a class="button" href="dashboard.html">+ New chat</a>

        <h3>Previous chats</h3>
        <div id="chat-list" class="chat-list"></div>

        <div class="sidebar-foot">
          <a href="dashboard.html">← Back to dashboard</a>
          <button id="logout" class="button secondary" type="button">Logout</button>
        </div>
      </aside>

      <section class="chat">
        <header class="chat-header">
          <button class="icon-btn chat-drawer-btn" type="button" aria-label="Open chats" aria-expanded="false">
            <span class="hamburger-lines"><i></i><i></i><i></i></span>
          </button>

          <h2 id="chat-header-title">Ask your repository</h2>

          <div class="nav-actions">
            <a
              class="icon-btn github-link"
              href="https://github.com/shreyaghorui222004/chat-with-repo"
              target="_blank"
              rel="noopener"
              aria-label="View on GitHub"
            >
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M12 .5C5.73.5.5 5.73.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56v-2c-3.2.7-3.88-1.37-3.88-1.37-.53-1.34-1.3-1.7-1.3-1.7-1.06-.72.08-.71.08-.71 1.17.08 1.79 1.2 1.79 1.2 1.04 1.79 2.73 1.27 3.4.97.1-.76.41-1.27.74-1.56-2.56-.29-5.26-1.28-5.26-5.7 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11 11 0 0 1 5.8 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.12 3.05.74.81 1.18 1.84 1.18 3.1 0 4.43-2.7 5.4-5.28 5.69.42.36.8 1.08.8 2.18v3.23c0 .31.21.68.8.56A11.51 11.51 0 0 0 23.5 12C23.5 5.73 18.27.5 12 .5Z"/>
              </svg>
            </a>
            <button class="icon-btn theme-toggle" type="button" aria-label="Toggle theme">
              <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/>
              </svg>
              <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="4"/>
                <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
              </svg>
            </button>
          </div>
        </header>

        <div id="messages" class="messages"></div>

        <form id="ask" class="composer">
          <textarea
            id="question"
            required
            placeholder="Ask a question about this repository…"
            autocomplete="off"
            rows="1"
          ></textarea>
          <button class="button" type="submit" aria-label="Send message">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M22 2 11 13"/>
              <path d="M22 2 15 22l-4-9-9-4 20-7Z"/>
            </svg>
          </button>
        </form>
      </section>
    </main>

    <script>
      /* Theme spin only — click is handled by app.js setupTheme() */
      new MutationObserver(function () {
        var btn = document.querySelector(".theme-toggle");
        if (!btn) return;
        btn.classList.add("spin");
        setTimeout(function () { btn.classList.remove("spin"); }, 380);
      }).observe(document.documentElement, {
        attributes: true,
        attributeFilter: ["data-theme"],
      });

      /* Mobile drawer — works with both body.drawer-open (app.js) and .open */
      var sidebar = document.querySelector(".sidebar");
      var backdrop = document.querySelector(".sidebar-backdrop");
      var drawerBtn = document.querySelector(".chat-drawer-btn");

      function setDrawer(open) {
        sidebar.classList.toggle("open", open);
        backdrop.classList.toggle("open", open);
        document.body.classList.toggle("drawer-open", open);
        drawerBtn.setAttribute("aria-expanded", String(open));
      }
      function closeDrawer() { setDrawer(false); }

      drawerBtn.addEventListener("click", function () {
        setDrawer(!sidebar.classList.contains("open"));
      });
      backdrop.addEventListener("click", closeDrawer);
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") closeDrawer();
      });

      /* Textarea auto-grow + Enter to send */
      var textarea = document.getElementById("question");
      var askForm = document.getElementById("ask");

      textarea.addEventListener("input", function () {
        textarea.style.height = "auto";
        textarea.style.height = Math.min(textarea.scrollHeight, 140) + "px";
      });
      textarea.addEventListener("keydown", function (e) {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          if (typeof askForm.requestSubmit === "function") askForm.requestSubmit();
          else askForm.dispatchEvent(new Event("submit", { cancelable: true, bubbles: true }));
        }
      });
    </script>
