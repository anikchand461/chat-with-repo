<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Create account | Chat WithRepo</title>
    <meta name="description" content="Create a Chat WithRepo account and start chatting with any GitHub repository." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
    <script>
      document.documentElement.setAttribute(
        "data-theme",
        localStorage.getItem("ChatWithRepo_theme") ||
          (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
      );
    </script>
    <style>
      /* ============================================================
         Page-level redesign for register.html
         Tokens below are scoped so this page reads consistently even
         before these values are folded into the shared css/app.css.
         Palette: forest / emerald / mint. Display face: Plus Jakarta
         Sans (used only for the wordmark + heading). Body/UI face: Inter.
      ============================================================ */
      :root {
        --brand-900: #063a2b;
        --brand-700: #0b6e4f;
        --brand-600: #0e9f6e;
        --brand-500: #17b57f;
        --brand-400: #55d6a4;
        --brand-300: #9fead0;
        --paper: #f5faf8;
        --paper-raised: #ffffff;
        --ink: #0c211b;
        --ink-soft: #4b6058;
        --line: rgba(11, 40, 30, 0.12);
        --danger: #e5484d;
        --ok: #17b57f;
        --shadow-soft: 0 20px 45px -25px rgba(6, 58, 43, 0.45);
        --radius-lg: 18px;
        --radius-md: 14px;
        --radius-sm: 10px;
        color-scheme: light;
      }
      html[data-theme="dark"] {
        --paper: #07130f;
        --paper-raised: #0e211a;
        --ink: #eaf7f1;
        --ink-soft: #9fc2b3;
        --line: rgba(159, 234, 208, 0.14);
        --shadow-soft: 0 25px 60px -25px rgba(0, 0, 0, 0.65);
        color-scheme: dark;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: "Inter", system-ui, sans-serif;
        color: var(--ink);
        background: var(--paper);
        transition: background-color 0.4s ease, color 0.4s ease;
        min-height: 100vh;
      }

      .auth {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        position: relative;
        overflow: hidden;
      }

      /* Ambient backdrop: soft emerald mesh glow, restrained, on-brand */
      .auth::before,
      .auth::after {
        content: "";
        position: absolute;
        border-radius: 50%;
        filter: blur(70px);
        opacity: 0.35;
        pointer-events: none;
        animation: drift 16s ease-in-out infinite alternate;
      }
      .auth::before {
        width: 480px;
        height: 480px;
        top: -160px;
        left: -120px;
        background: radial-gradient(circle, var(--brand-500), transparent 70%);
      }
      .auth::after {
        width: 420px;
        height: 420px;
        bottom: -140px;
        right: -100px;
        background: radial-gradient(circle, var(--brand-300), transparent 70%);
        animation-delay: -8s;
      }
      @keyframes drift {
        from { transform: translate(0, 0) scale(1); }
        to { transform: translate(30px, 20px) scale(1.08); }
      }
      @media (prefers-reduced-motion: reduce) {
        .auth::before, .auth::after { animation: none; }
      }

      .card {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 400px;
        display: flex;
        flex-direction: column;
        gap: 18px;
        padding: 36px 32px;
        border-radius: var(--radius-lg);
        background: color-mix(in srgb, var(--paper-raised) 78%, transparent);
        backdrop-filter: blur(18px) saturate(140%);
        -webkit-backdrop-filter: blur(18px) saturate(140%);
        border: 1px solid var(--line);
        box-shadow: var(--shadow-soft);
        animation: card-in 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      @keyframes card-in {
        from { opacity: 0; transform: translateY(14px) scale(0.98); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-family: "Plus Jakarta Sans", "Inter", sans-serif;
        font-weight: 700;
        font-size: 19px;
        letter-spacing: -0.01em;
        color: var(--ink);
        text-decoration: none;
        width: fit-content;
      }
      .brand span { color: var(--brand-600); }
      .brand-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--brand-500);
        box-shadow: 0 0 0 0 rgba(23, 181, 127, 0.55);
        animation: pulse 2.4s ease-in-out infinite;
      }
      @keyframes pulse {
        0%   { box-shadow: 0 0 0 0 rgba(23, 181, 127, 0.55); }
        70%  { box-shadow: 0 0 0 8px rgba(23, 181, 127, 0); }
        100% { box-shadow: 0 0 0 0 rgba(23, 181, 127, 0); }
      }

      .card h1 {
        font-family: "Plus Jakarta Sans", sans-serif;
        font-weight: 700;
        font-size: 26px;
        letter-spacing: -0.01em;
        margin: 4px 0 0;
      }
      .card > p {
        margin: 0;
        color: var(--ink-soft);
        font-size: 14.5px;
        line-height: 1.5;
      }

      /* Floating label fields */
      .field {
        position: relative;
        margin-top: 4px;
      }
      .field input {
        width: 100%;
        padding: 18px 14px 8px;
        font: inherit;
        font-size: 15px;
        color: var(--ink);
        background: var(--paper);
        border: 1.5px solid var(--line);
        border-radius: var(--radius-sm);
        outline: none;
        transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.4s ease;
      }
      .field input:focus {
        border-color: var(--brand-500);
        box-shadow: 0 0 0 4px color-mix(in srgb, var(--brand-500) 18%, transparent);
      }
      .field label {
        position: absolute;
        left: 14px;
        top: 14px;
        font-size: 15px;
        color: var(--ink-soft);
        pointer-events: none;
        transform-origin: left top;
        transition: transform 0.16s ease, color 0.16s ease, top 0.16s ease;
      }
      .field input:focus + label,
      .field input:not(:placeholder-shown) + label {
        top: 7px;
        transform: scale(0.72);
        color: var(--brand-600);
      }
      .field input.invalid {
        border-color: var(--danger);
        animation: shake 0.32s ease;
      }
      @keyframes shake {
        25% { transform: translateX(-4px); }
        75% { transform: translateX(4px); }
      }

      .error {
        margin: -6px 0 0;
        min-height: 18px;
        font-size: 13px;
        color: var(--danger);
        transition: opacity 0.2s ease;
      }
      .error:empty { opacity: 0; }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font: inherit;
        font-weight: 600;
        font-size: 15px;
        border: none;
        border-radius: var(--radius-sm);
        cursor: pointer;
        transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
      }
      .button.block {
        width: 100%;
        padding: 13px 16px;
        color: #05261c;
        background: linear-gradient(135deg, var(--brand-400), var(--brand-600));
        box-shadow: 0 12px 24px -12px color-mix(in srgb, var(--brand-600) 70%, transparent);
      }
      .button.block:hover { transform: translateY(-2px); filter: brightness(1.04); }
      .button.block:active { transform: translateY(0); }
      .button.block:disabled {
        cursor: not-allowed;
        filter: grayscale(0.3) brightness(0.95);
        transform: none;
      }
      .button.block .spinner { display: none; }
      .button.block.loading .label { visibility: hidden; }
      .button.block.loading .spinner {
        display: block;
        position: absolute;
        width: 18px;
        height: 18px;
        border: 2px solid rgba(5, 38, 28, 0.35);
        border-top-color: #05261c;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      a { color: var(--brand-600); }
      a:focus-visible,
      button:focus-visible,
      input:focus-visible {
        outline: 2px solid var(--brand-500);
        outline-offset: 2px;
      }

      .nav-actions {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .icon-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 38px;
        height: 38px;
        border-radius: 50%;
        border: 1px solid var(--line);
        background: var(--paper);
        color: var(--ink-soft);
        cursor: pointer;
        transition: transform 0.15s ease, color 0.15s ease, border-color 0.15s ease;
      }
      .icon-btn:hover { transform: translateY(-2px); color: var(--brand-600); border-color: var(--brand-400); }
      .icon-btn svg { width: 18px; height: 18px; }

      .theme-toggle .sun { display: none; }
      html[data-theme="dark"] .theme-toggle .moon { display: none; }
      html[data-theme="dark"] .theme-toggle .sun { display: block; }
      .theme-toggle svg { transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1); }
      .theme-toggle.spin svg { transform: rotate(180deg); }

      @media (max-width: 420px) {
        .card { padding: 28px 20px; border-radius: var(--radius-md); }
      }
    </style>
  </head>
  <body>
    <main class="auth">
      <form id="auth-form" class="card" novalidate>
        <a class="brand" href="index.html"><span class="brand-dot"></span>Chat<span>WithRepo</span></a>
        <h1>Create account</h1>
        <p>Index your first repository in under a minute.</p>

        <div class="field">
          <input id="email" type="email" placeholder=" " autocomplete="email" required />
          <label for="email">Email</label>
        </div>

        <div class="field">
          <input id="password" type="password" placeholder=" " autocomplete="new-password" minlength="8" required />
          <label for="password">Password</label>
        </div>

        <p id="error" class="error" role="alert" aria-live="polite"></p>

        <button class="button block" type="submit">
          <span class="label">Register</span>
          <span class="spinner" aria-hidden="true"></span>
        </button>

        <a href="login.html" style="font-size: 14px; text-align: center">Already have an account?</a>

        <div class="nav-actions" style="justify-content: center">
          <a class="icon-btn github-link" href="https://github.com/shreyaghorui222004/chat-with-repo" target="_blank" rel="noopener" aria-label="View on GitHub">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .5C5.73.5.5 5.73.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56v-2c-3.2.7-3.88-1.37-3.88-1.37-.53-1.34-1.3-1.7-1.3-1.7-1.06-.72.08-.71.08-.71 1.17.08 1.79 1.2 1.79 1.2 1.04 1.79 2.73 1.27 3.4.97.1-.76.41-1.27.74-1.56-2.56-.29-5.26-1.28-5.26-5.7 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11 11 0 0 1 5.8 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.12 3.05.74.81 1.18 1.84 1.18 3.1 0 4.43-2.7 5.4-5.28 5.69.42.36.8 1.08.8 2.18v3.23c0 .31.21.68.8.56A11.51 11.51 0 0 0 23.5 12C23.5 5.73 18.27.5 12 .5Z"/></svg>
          </a>
          <button class="icon-btn theme-toggle" type="button" aria-label="Toggle theme">
            <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
            <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          </button>
        </div>
      </form>
    </main>

    <script>
      // --- Theme toggle: persists to localStorage, smooth animated switch ---
      var themeBtn = document.querySelector(".theme-toggle");
      themeBtn.addEventListener("click", function () {
        var root = document.documentElement;
        var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
        root.setAttribute("data-theme", next);
        localStorage.setItem("Chat WithRepo_theme", next);
        themeBtn.classList.add("spin");
        setTimeout(function () { themeBtn.classList.remove("spin"); }, 400);
      });

      // --- Lightweight UI-only affordances layered on top of the existing
      //     form handling in js/app.js below. These never call
      //     preventDefault(), so the real submit/auth logic is untouched. ---
      var form = document.getElementById("auth-form");
      var submitBtn = form.querySelector('button[type="submit"]');
      var emailInput = document.getElementById("email");
      var passInput = document.getElementById("password");

      form.addEventListener("submit", function () {
        [emailInput, passInput].forEach(function (input) {
          input.classList.toggle("invalid", !input.checkValidity());
        });
        if (form.checkValidity()) {
          submitBtn.classList.add("loading");
          submitBtn.disabled = true;
        }
      });

      // If js/app.js surfaces an error (e.g. sets #error text or a failed
      // fetch), clear the loading state so the button doesn't stay stuck.
      var errorEl = document.getElementById("error");
      new MutationObserver(function () {
        if (errorEl.textContent.trim()) {
          submitBtn.classList.remove("loading");
          submitBtn.disabled = false;
        }
      }).observe(errorEl, { childList: true, characterData: true, subtree: true });
    </script>
    <script src="js/app.js"></script>
  </body>
</html>
